[project]
name = "spoton-smart-parking"
version = "1.0.0"
description = "Full-stack Flask/PostgreSQL smart parking management system for drivers, operators, and administrators."
authors = [
    { name = "Vivek Jariwala", email = "vj83530n@pace.edu" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask==3.1.0",
    "gunicorn==23.0.0",
    "psycopg2-binary==2.9.10",
    "Werkzeug==3.1.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
